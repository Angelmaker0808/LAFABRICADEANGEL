<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sigue tu pedido · Estudio Terra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="seguimiento">
  <div id="top"></div>
  
  <main class="container" style="max-width: 600px; margin: 40px auto; padding: 0 20px;">
    <h1 style="text-align: center; margin-bottom: 8px;">Sigue tu pedido</h1>
    <p style="text-align: center; color: #6B7280; margin-bottom: 32px;">Introduce el código de tu reserva y el correo con el que la hiciste.</p>
    
    <!-- ✅ IDs track-form y out son obligatorios para que funcione el script -->
    <form id="track-form" style="display: flex; flex-direction: column; gap: 16px;">
      <div class="field">
        <label for="codigo">Código de reserva</label>
        <input type="text" id="codigo" name="codigo" required placeholder="Ej: RES-A1B2" style="text-transform: uppercase;">
      </div>
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required placeholder="tu@email.com">
      </div>
      <button type="submit" class="btn big accent" style="margin-top: 8px;">Consultar estado</button>
    </form>

    <div id="out" style="margin-top: 40px;"></div>
  </main>
  
  <div id="bottom"></div>
  
  <script src="backend.js"></script>
  <script src="app.js"></script>
</body>
</html>
