<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Confirmar reserva · Estudio Terra</title><meta name="description" content="Datos de contacto, entrega y pago.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head><body data-page="finalizar"><div id="top"></div><main>
<div class="container"><div class="page-head"><h1>Confirmar reserva</h1><p>Elige cómo quieres recibirlo y cómo pagar.</p></div>
<div class="cw" id="checkout">
<form id="form" name="reservas-3d" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="form">
<input type="hidden" name="form-name" value="reservas-3d">
<p hidden><label>No rellenar <input name="bot-field"></label></p>
<input type="hidden" name="codigo"><input type="hidden" name="total"><textarea name="pedido" hidden></textarea>

<div class="field"><label>Nombre y apellidos *</label><input name="nombre" required autocomplete="name"></div>
<div class="field"><label>Correo electrónico *</label><input type="email" name="email" required autocomplete="email"></div>
<div class="field"><label>Teléfono / WhatsApp *</label><input type="tel" name="telefono" required autocomplete="tel"></div>

<!-- MÉTODO DE PAGO · pill style -->
<div class="field">
  <label>Método de pago *</label>
  <div class="pills" role="radiogroup" id="pago-pills">
    <button type="button" class="pill" disabled title="Próximamente">💳 Tarjeta · próximamente</button>
    <button type="button" class="pill on" data-pay="efectivo">💵 Efectivo al recibir</button>
  </div>
  <input type="hidden" name="metodo_pago" value="efectivo">
</div>

<!-- MODO DE ENTREGA · pill style -->
<div class="field">
  <label>Modo de entrega *</label>
  <div class="pills" role="radiogroup" id="entrega-pills">
    <button type="button" class="pill" disabled title="Próximamente">🚚 Envío · próximamente</button>
    <button type="button" class="pill on" data-ship="recogida">📍 Recogida en punto</button>
  </div>
  <input type="hidden" name="entrega" value="recogida">
</div>

<!-- Bloque recogida -->
<div id="bloque-recogida">
  <div class="field">
    <label>Elige punto de recogida *</label>
    <div class="pills" id="puntos-pills">
      <button type="button" class="pill" data-punto="Kiosko Angel">Kiosko Angel</button>
      <button type="button" class="pill" data-punto="Papeleria Alfe Rami">Papeleria Alfe Rami</button>
      <button type="button" class="pill" data-punto="Metro de Montequinto">Metro de Montequinto</button>
      <button type="button" class="pill" data-punto="otro">Otro punto</button>
    </div>
    <input type="hidden" name="punto_recogida" required>
    <div class="field" id="punto-otro-wrap" hidden style="margin-top:.8rem">
      <label>Dirección del punto (si "Otro")</label>
      <input name="punto_recogida_otro" placeholder="Calle, local...">
    </div>
  </div>
</div>

<div class="field"><label>Notas (opcional)</label><textarea name="notas" rows="3" placeholder="Algo que debamos saber de tu pedido"></textarea></div>

<label class="chk"><input type="checkbox" name="privacidad" required> Acepto la <a href="legal.html#privacidad" style="text-decoration:underline">política de privacidad</a> y que usen mis datos para gestionar el pedido.</label>
<p id="err" class="error" role="alert" hidden></p>
<button class="btn big accent" id="send">Confirmar reserva</button>
</form>
<aside class="summary">
  <h2>Resumen</h2>
  <div id="sum"></div>
</aside>
</div>
<div class="donebox" id="done" hidden><div class="ok">✓</div><h1>¡Reserva recibida!</h1><p id="done-msg">Hemos recibido tu solicitud. Te responderemos a tu correo.</p>
<p>Tu número de pedido</p><div class="codebox" id="code"></div><button class="btn ghost" id="copy">Copiar código</button> <a class="btn" id="track" href="seguimiento.html">Ver estado del pedido</a></div>
</div>
</main><div id="bottom"></div>

<style>
/* mini-estilos para pills de método / entrega / punto · no rompen la estética */
#pago-pills .pill, #entrega-pills .pill, #puntos-pills .pill{
  background:var(--surface); border:1px solid var(--line); color:var(--ink);
  font-size:.85rem; padding:.7rem 1rem; min-height:auto;
}
#pago-pills .pill:disabled, #entrega-pills .pill:disabled{
  opacity:.4; cursor:not-allowed; text-decoration:line-through;
}
#pago-pills .pill.on, #entrega-pills .pill.on, #puntos-pills .pill.on{
  background:var(--ink); color:#fff; border-color:var(--ink);
}
</style>

<script>
// ---------- Pago ----------
const pagoPills = document.querySelectorAll('#pago-pills .pill');
const pagoInput = document.querySelector('[name="metodo_pago"]');
pagoPills.forEach(p => p.addEventListener('click', () => {
  if (p.disabled) return;
  pagoPills.forEach(x => x.classList.remove('on'));
  p.classList.add('on');
  pagoInput.value = p.dataset.pay;
}));

// ---------- Entrega ----------
const entregaPills = document.querySelectorAll('#entrega-pills .pill');
const entregaInput = document.querySelector('[name="entrega"]');
const bloqueRecogida = document.getElementById('bloque-recogida');
entregaPills.forEach(p => p.addEventListener('click', () => {
  if (p.disabled) return;
  entregaPills.forEach(x => x.classList.remove('on'));
  p.classList.add('on');
  entregaInput.value = p.dataset.ship;
  bloqueRecogida.hidden = p.dataset.ship !== 'recogida';
}));

// ---------- Puntos de recogida ----------
const puntoPills = document.querySelectorAll('#puntos-pills .pill');
const puntoInput = document.querySelector('[name="punto_recogida"]');
const puntoOtroWrap = document.getElementById('punto-otro-wrap');
const puntoOtroField = document.querySelector('[name="punto_recogida_otro"]');
puntoPills.forEach(p => p.addEventListener('click', () => {
  puntoPills.forEach(x => x.classList.remove('on'));
  p.classList.add('on');
  puntoInput.value = p.dataset.punto;
  puntoOtroWrap.hidden = p.dataset.punto !== 'otro';
  puntoOtroField.required = p.dataset.punto === 'otro';
}));
// selección por defecto
document.querySelector('[data-punto="Kiosko Angel"]').click();

// ---------- Desglose IVA en el resumen ----------
// Se ejecuta tras rellenar el carrito desde app.js/backend.js.
// Añadimos una línea desglosada al aside #sum si no existe.
function renderIvaBreakdown() {
  const sum = document.getElementById('sum');
  if (!sum || sum.dataset.ivaDone) return;
  // Busca el total
  const totals = sum.querySelectorAll('p, .tot');
  let total = 0;
  sum.querySelectorAll('p').forEach(p => {
    if (/total/i.test(p.textContent)) {
      const m = p.textContent.match(/([\d.,]+)\s*€/);
      if (m) total = parseFloat(m[1].replace(/\./g,'').replace(',','.'));
    }
  });
  if (!total) return;
  const base = total / 1.21;
  const iva = total - base;
  const fmt = n => n.toFixed(2).replace('.', ',') + ' €';
  const div = document.createElement('div');
  div.style.cssText = 'border-top:1px dashed var(--line);margin-top:.6rem;padding-top:.6rem;font-size:.78rem;color:var(--muted);line-height:1.6';
  div.innerHTML =
    '<p style="display:flex;justify-content:space-between;margin:.15rem 0"><span>Base imponible</span><span>' + fmt(base) + '</span></p>' +
    '<p style="display:flex;justify-content:space-between;margin:.15rem 0"><span>IVA (21%)</span><span>' + fmt(iva) + '</span></p>' +
    '<p style="display:flex;justify-content:space-between;margin:.15rem 0;font-weight:600;color:var(--ink)"><span>Total (IVA incl.)</span><span>' + fmt(total) + '</span></p>';
  sum.appendChild(div);
  sum.dataset.ivaDone = '1';
}
// reintenta hasta que el carrito se haya renderizado
const ivaTimer = setInterval(() => {
  const sum = document.getElementById('sum');
  if (sum && sum.children.length > 0) { renderIvaBreakdown(); clearInterval(ivaTimer); }
}, 300);
setTimeout(() => clearInterval(ivaTimer), 8000);
</script>
<script src="backend.js"></script><script src="app.js"></script></body></html>
