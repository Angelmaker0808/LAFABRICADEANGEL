<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Confirmar reserva · Estudio Terra</title><meta name="description" content="Datos de contacto, entrega y pago.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head><body data-page="finalizar"><div id="top"></div><main>
<div class="container"><div class="page-head"><h1>Confirmar reserva</h1><p>Elige cómo quieres recibirlo y cómo pagar.</p></div>
<div class="cw" id="checkout">
<form id="form" name="reservas-3d" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="form"><input type="hidden" name="form-name" value="reservas-3d"><p hidden><label>No rellenar <input name="bot-field"></label></p>
<input type="hidden" name="codigo"><input type="hidden" name="total"><textarea name="pedido" hidden></textarea>

<!-- Datos personales -->
<div class="field"><label>Nombre y apellidos *</label><input name="nombre" required autocomplete="name"></div>
<div class="field"><label>Correo electrónico *</label><input type="email" name="email" required autocomplete="email"></div>
<div class="field"><label>Teléfono / WhatsApp *</label><input type="tel" name="telefono" required autocomplete="tel"></div>

<!-- Modo de pago -->
<div class="field">
  <label>¿Cómo quieres pagar? *</label>
  <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">
    <label style="display:flex;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:#fff">
      <input type="radio" name="metodo_pago" value="tarjeta" required style="margin-top:3px">
      <div><b>💳 Pagar ahora con tarjeta</b><br><small style="color:var(--muted)">Te enviamos el enlace de pago seguro tras confirmar la reserva</small></div>
    </label>
    <label style="display:flex;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:#fff">
      <input type="radio" name="metodo_pago" value="efectivo" required style="margin-top:3px">
      <div><b>💵 Pagar al recibir (efectivo)</b><br><small style="color:var(--muted)">Reservas ahora y pagas al recoger o recibir</small></div>
    </label>
  </div>
</div>

<!-- Modo de entrega -->
<div class="field">
  <label>¿Cómo quieres recibirlo? *</label>
  <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">
    <label style="display:flex;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:#fff">
      <input type="radio" name="entrega" value="envio" required style="margin-top:3px">
      <div><b>🚚 Envío a domicilio</b><br><small style="color:var(--muted)">Los gastos de envío se añaden en el enlace de pago</small></div>
    </label>
    <label style="display:flex;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:#fff">
      <input type="radio" name="entrega" value="recogida" required style="margin-top:3px">
      <div><b>📍 Recoger en punto</b><br><small style="color:var(--muted)">Sin gastos de envío</small></div>
    </label>
  </div>
</div>

<!-- Bloque envío (oculto si recogida) -->
<div id="bloque-envio" hidden>
  <div class="field"><label>Calle y número *</label><input name="calle" autocomplete="street-address"></div>
  <div class="field"><div class="row"><div><label>Código postal *</label><input name="cp" pattern="[0-9]{5}" inputmode="numeric" autocomplete="postal-code" title="5 dígitos"></div><div><label>Ciudad *</label><input name="ciudad" autocomplete="address-level2"></div></div></div>
  <div class="field"><label>Provincia *</label><input name="provincia" autocomplete="address-level1"></div>
</div>

<!-- Bloque recogida (oculto si envío) -->
<div id="bloque-recogida" hidden>
  <div class="field">
    <label>Elige punto de recogida *</label>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">
      <label style="display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#fff">
        <input type="radio" name="punto_recogida" value="Kiosko Angel" style="margin-top:3px">
        <div><b>Kiosko Angel</b><br><small style="color:var(--muted)">Punto de recogida</small></div>
      </label>
      <label style="display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#fff">
        <input type="radio" name="punto_recogida" value="Papeleria Alfe Rami" style="margin-top:3px">
        <div><b>Papeleria Alfe Rami</b><br><small style="color:var(--muted)">Punto de recogida</small></div>
      </label>
      <label style="display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#fff">
        <input type="radio" name="punto_recogida" value="Metro de Montequinto" style="margin-top:3px">
        <div><b>Metro de Montequinto</b><br><small style="color:var(--muted)">Punto de recogida</small></div>
      </label>
      <label style="display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#fff">
        <input type="radio" name="punto_recogida" value="otro" style="margin-top:3px">
        <div><b>Otro punto</b><br><small style="color:var(--muted)">Propondré uno en las notas</small></div>
      </label>
    </div>
  </div>
  <div class="field"><label>Dirección / referencia del punto (si "Otro")</label><input name="punto_recogida_otro" placeholder="Calle, local..."></div>
</div>

<div class="field"><label>Notas (opcional)</label><textarea name="notas" rows="3" placeholder="Algo que debamos saber de tu pedido"></textarea></div>

<label class="chk"><input type="checkbox" name="privacidad" required> Acepto la <a href="legal.html#privacidad" style="text-decoration:underline">política de privacidad</a> y que usen mis datos para gestionar el pedido.</label>
<p id="err" class="error" role="alert" hidden></p><button class="btn big accent" id="send">Confirmar reserva</button></form>
<aside class="summary"><h2>Resumen</h2><div id="sum"></div></aside></div>
<div class="donebox" id="done" hidden><div class="ok">✓</div><h1>¡Reserva recibida!</h1><p id="done-msg">Hemos recibido tu solicitud. Te responderemos a tu correo.</p>
<p>Tu número de pedido</p><div class="codebox" id="code"></div><button class="btn ghost" id="copy">Copiar código</button> <a class="btn" id="track" href="seguimiento.html">Ver estado del pedido</a></div></div>
</main><div id="bottom"></div>
<script>
// Toggle bloques según entrega
document.querySelectorAll('[name="entrega"]').forEach(r => {
  r.addEventListener('change', () => {
    const v = document.querySelector('[name="entrega"]:checked').value;
    document.getElementById('bloque-envio').hidden = v !== 'envio';
    document.getElementById('bloque-recogida').hidden = v !== 'recogida';
    // Ajustar required
    ['calle','cp','ciudad','provincia'].forEach(n => {
      const el = document.querySelector('[name="'+n+'"]');
      if (el) el.required = (v === 'envio');
    });
    document.querySelectorAll('[name="punto_recogida"]').forEach(el => el.required = (v === 'recogida'));
  });
});
// Al marcar "otro", permitir escribir la dirección libre
document.querySelectorAll('[name="punto_recogida"]').forEach(r => {
  r.addEventListener('change', () => {
    const isOtro = document.querySelector('[name="punto_recogida"]:checked')?.value === 'otro';
    document.querySelector('[name="punto_recogida_otro"]').required = isOtro;
  });
});
</script>
<script src="backend.js"></script><script src="app.js"></script></body></html>
