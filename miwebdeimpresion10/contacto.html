<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contacto · Estudio Terra</title><meta name="description" content="Escríbenos para cualquier duda.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"></head><body data-page="contacto"><div id="top"></div><main>
<div class="container narrow"><div class="page-head"><h1>Contacto</h1><p>Escríbenos a <a href="mailto:hola@estudioterra.com" style="text-decoration:underline">hola@estudioterra.com</a> o usa el formulario.</p></div>
<form id="contact-form" name="contacto" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="form" style="margin-top:20px"><input type="hidden" name="form-name" value="contacto"><p hidden><label>No rellenar <input name="bot-field"></label></p>
<div class="field"><label>Nombre *</label><input name="nombre" required></div><div class="field"><label>Correo electrónico *</label><input type="email" name="email" required></div>
<div class="field"><label>Asunto</label><input name="asunto"></div><div class="field"><label>Mensaje *</label><textarea name="mensaje" rows="5" required></textarea></div>
<label class="chk"><input type="checkbox" name="privacidad" required> Acepto la <a href="legal.html#privacidad" style="text-decoration:underline">política de privacidad</a>.</label>
<p id="c-err" class="error" role="alert" hidden></p><button class="btn" id="c-send">Enviar mensaje</button></form></div>
</main><div id="bottom"></div><script src="backend.js"></script><script src="app.js"></script></body></html>
