<!DOCTYPE html><html lang="es"><head><title>Finalizar reserva · Mi Estudio 3D</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"></head><body>
<header class="top"><a class="brand" href="index.html">Mi Estudio 3D</a><nav class="nav"><a href="seguimiento.html">Seguir pedido</a></nav><a class="cart-link" href="carrito.html" aria-label="Ver carrito">Carrito <span id="badge" class="badge">0</span></a></header>
<main class="wrap checkout" id="checkout">
  <!-- Formulario: Netlify lo detecta por data-netlify y name="reservas-3d" -->
  <form id="form" name="reservas-3d" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="form">
    <h1>Tus datos</h1>
    <input type="hidden" name="form-name" value="reservas-3d">
    <p hidden><label>No rellenar <input name="bot-field"></label></p>
    <input type="hidden" name="codigo" id="f-codigo">
    <textarea name="pedido" id="f-pedido" hidden></textarea>
    <input type="hidden" name="total" id="f-total">
    <label>Nombre y apellidos<input name="nombre" required autocomplete="name"></label>
    <label>Correo electrónico<input type="email" name="email" required autocomplete="email"></label>
    <label>Teléfono / WhatsApp<input type="tel" name="telefono" required autocomplete="tel"></label>
    <label>Calle y número<input name="calle" required autocomplete="street-address"></label>
    <div class="row"><label>Código postal<input name="cp" required pattern="[0-9]{5}" inputmode="numeric" autocomplete="postal-code" title="5 dígitos"></label>
    <label>Ciudad<input name="ciudad" required autocomplete="address-level2"></label></div>
    <label>Provincia<input name="provincia" required autocomplete="address-level1"></label>
    <label class="check"><input type="checkbox" name="privacidad" required> Acepto que se usen mis datos solo para gestionar este pedido (política de privacidad básica).</label>
    <p id="err" class="error" role="alert" hidden></p>
    <button class="btn" id="send">Enviar reserva</button>
  </form>
  <aside class="summary"><h2>Resumen</h2><div id="sum"></div></aside>
</main>
<!-- Pantalla de confirmación -->
<main class="wrap narrow done" id="done" hidden>
  <h1>¡Reserva enviada!</h1><p>Tu código de referencia:</p><div class="code" id="code"></div>
  <button class="btn ghost" id="copy">Copiar código</button>
  <p>Hemos recibido tu solicitud. En breve revisaremos tu pedido y te responderemos a tu correo con el enlace de pago para iniciar la elaboración.</p>
  <a class="btn ghost" id="track" href="seguimiento.html">Seguir mi pedido</a> <a class="btn" href="index.html">Volver a la tienda</a>
</main>
<script src="backend.js"></script><script src="app.js"></script></body></html>
